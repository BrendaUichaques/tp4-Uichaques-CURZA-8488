services:
  web_server:
    image: nginx:alpine
    container_name: web_server
    ports:
      - "${WEB_PORT:-8000}:80"
      - "${REPORT_PORT:-9000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - logs:/var/log/shared
      - report:/srv/report:ro
    restart: unless-stopped

  log_analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log_analyzer
    depends_on:
      - web_server
    ports:
      - "7890:7890"
    volumes:
      - logs:/srv/logs:ro
      - report:/srv/report
    restart: unless-stopped

volumes:
  logs:
  report:
