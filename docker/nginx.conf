worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format combined_fmt '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

    # Log en el volumen compartido
    access_log /var/log/shared/access.log combined_fmt;
    error_log  /var/log/nginx/error.log warn;

    # Sitio principal (host 8000+XX -> contenedor 80)
    server {
        listen 80;
        server_name _;
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }
    }

    # Reporte de GoAccess (host 9000+XX -> contenedor 8080)
    server {
        listen 8080;
        server_name _;
        access_log off;
        location / {
            root  /srv/report;
            index report.html;
        }
    }
}
