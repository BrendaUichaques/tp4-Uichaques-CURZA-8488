---
# Playbook TP4: instala Docker, copia configuración y levanta el stack
- name: Aprovisionar servidor de analisis de trafico (Nginx + GoAccess)
  hosts: lab_systems
  become: yes
  vars:
    app_dir: /opt/tp4-curza/docker
    config_files:
      - Dockerfile
      - docker-compose.yml
      - goaccess.conf
      - .env

  tasks:
    - name: Instalar Docker y dependencias
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - python3-docker
          - ca-certificates
        state: present
        update_cache: yes

    - name: Asegurar que el servicio Docker este iniciado y habilitado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Crear directorio de la aplicacion
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar configuracion de Nginx (notifica al handler si cambia)
      ansible.builtin.copy:
        src: ../docker/nginx.conf
        dest: "{{ app_dir }}/nginx.conf"
        mode: "0644"
      notify: Reiniciar Nginx

    - name: Copiar Dockerfile, compose, goaccess.conf y .env
      ansible.builtin.copy:
        src: "../docker/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ config_files }}"

    - name: Levantar contenedores con Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: policy
        state: present

  handlers:
    - name: Reiniciar Nginx
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        services:
          - web_server
        state: restarted
